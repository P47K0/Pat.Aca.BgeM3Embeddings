# Applied after create/update: min 0 / max 1 and a 600 s cooldown, longer than
# the Worker's 5-minute /health ping so the app stays warm while the fallback
# note is active and scales to zero by itself after 00:00 UTC.
properties:
  template:
    scale:
      minReplicas: 0
      maxReplicas: 1
      cooldownPeriod: 600
